name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:deploy
      - run: npm run format:check
      - run: npm run build
      - run: npm run check:deploy
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.8'
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --project pipeline --locked --python 3.14
      - run: uv run --project pipeline pytest pipeline/tests
      - run: uv run --project pipeline ruff check pipeline
      - run: uv run --project pipeline water-pulse all --offline
