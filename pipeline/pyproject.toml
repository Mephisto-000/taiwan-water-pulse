[project]
name = "water-pulse-pipeline"
version = "0.1.0"
description = "Reproducible public-data preparation for Taiwan's Water Pulse"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.13,<4",
    "earthaccess>=0.16,<1",
    "fsspec>=2026.9",
    "h5py>=3.15,<4",
    "numpy>=2.4,<3",
    "pyproj>=3.7,<4",
    "rasterio>=1.4,<2",
    "scipy>=1.17,<2",
]

[project.scripts]
water-pulse = "water_pulse.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/water_pulse"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
